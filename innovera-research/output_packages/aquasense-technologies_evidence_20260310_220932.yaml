    problem_summary: Municipal water utilities across North America lose 20-30% of treated water through leaks in aging distribution
      infrastructure, costing an estimated $2.6 billion annually in non-revenue water in the US alone. Current detection methods
      rely on manual acoustic surveys by field crews covering only 2-5 miles per day, and most utilities operate reactively
      — discovering leaks only after visible damage or pipe failure. Regulatory mandates (EPA LCRR, California SB 555) are
      imposing compliance deadlines for water loss auditing, while an aging utility workforce exacerbates the operational
      challenge.
    solution_summary: AquaSense Technologies deploys networks of IoT acoustic sensors on water mains that continuously monitor
      pipe vibration to detect leaks in real time without excavation. A cloud-based AI platform classifies leak severity,
      predicts pipe failure probability, prioritizes maintenance work orders by risk score, and integrates with existing SCADA
      and GIS systems. The platform also generates automated compliance reports for AWWA water audits, and is delivered as
      a hardware lease plus SaaS subscription.
    target_customer_summary: Primary customers are mid-sized US municipal water utilities serving populations of 50,000–500,000
      (approximately 1,200 utilities), which face significant water loss but lack resources for proprietary monitoring systems.
      Secondary targets include industrial facilities with critical water infrastructure such as food and beverage manufacturers,
      data centers, and pharmaceutical plants.
