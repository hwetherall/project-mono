              using syndicated market estimates as upper bounds, then narrowing to an addressable niche via percentage capture
              analysis (e.g., 0.15–0.35% of global CDMO implies USD 350 million revenue by year 3). No explicit bottom-up
              unit-economics build from individual programs or customer counts is presented, though qualitative anchors (3–5
              anchor OEM programs) are noted.'
