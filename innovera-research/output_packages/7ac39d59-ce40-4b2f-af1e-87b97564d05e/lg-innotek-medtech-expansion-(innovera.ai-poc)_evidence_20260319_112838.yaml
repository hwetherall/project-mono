    problem_summary: LG Innotek (LGIT) has advanced CoF and flexible PCB substrate manufacturing capabilities with 10µm-level
      resolution, currently deployed in IT and automotive markets. The company seeks to leverage these capabilities to enter
      high-value medical device markets—specifically CGM systems, neurostimulation devices, and BCI systems—where thin, flexible,
      high-density electrode substrates are critical enabling components. The core challenge is determining where in the medical
      device supply chain LGIT can defensibly participate given its substrate expertise but absence of medical certifications,
      biosignal IP, and finished-device experience.
    solution_summary: LGIT proposes to enter the medtech value chain as a component supplier or CDMO, providing CoF-based
      flexible substrates, electrode modules, and potentially higher-order assemblies to OEM medical device manufacturers
      such as Abbott. The company is evaluating a range of business model scopes—from PCB components only through components
      plus materials, device integration, or software—and is considering M&A of system-capable startups (e.g., Echo) to accelerate
      capability expansion. The strategic goal is to move up the value chain from commodity substrates toward differentiated
      medical-grade components and modules commanding >30% operating margins.
    target_customer_summary: Primary target customers are large OEM medical device manufacturers—especially Abbott across
      its Diabetes, Neuro, and Cardiac divisions—that require advanced flexible circuit substrates, electrode arrays, and
      miniaturized sensor modules for wearable and implantable products. Secondary targets include other Tier-1 medtech OEMs
      and neurostimulation/BCI companies seeking qualified component and module suppliers capable of medical-grade manufacturing.
