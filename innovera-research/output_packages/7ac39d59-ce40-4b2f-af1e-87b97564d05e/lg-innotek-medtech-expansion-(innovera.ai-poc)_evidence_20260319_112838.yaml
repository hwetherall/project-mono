          \nIn-text citations\n- CGM growth and concentration, Abbott/Dexcom strategy and manufacturing expansions, and reimbursement\
          \ tailwinds ([Abbott, 2026](https://www.abbott.com/en-us/corpnewsroom/strategy-and-strength/2025-results-abbott-achieves-double-digit-earnings-growth);\
          \ [Dexcom, 2024 AR](https://s201.q4cdn.com/758408164/files/doc_financials/2024/ar/dexcom-2024-annual-report.pdf);\
          \ [Mordor Intelligence—CGM, 2026](https://www.mordorintelligence.com/industry-reports/continuous-glucose-monitoring-market);\
          \ [Drug Delivery Business/Abbott facilities, 2024–2026](https://www.drugdeliverybusiness.com/abbott-looks-expand-cgm-plant-ireland/)).\n\
          - Printed electronics and flexible hybrids market shares/CAGR, screen-printing dominance, and validation cycle hurdles\
          \ ([Mordor Intelligence—printed electronics, 2026](https://www.mordorintelligence.com/industry-reports/global-printed-electronics-market-in-healthcare-industry)).\n\
          - CDMO and EMS economics and operating margins; role of ISO 13485 QMS and sterilization partners ([Flex IR, 2026](https://investors.flex.com/news/news-details/2026/FLEX-REPORTS-THIRD-QUARTER-FISCAL-2026-RESULTS/default.aspx);\
          \ [HTF MI, 2026](https://www.htfmarketinsights.com/report/4418133-medical-device-contract-manufacturing-global);\
          \ [Pathway Medtech, 2026](https://pathwaymedtech.com/medical-device-contract-manufacturing-2/)).\n\nAppendix: Selected\
          \ comparative data tables\n\n1) CGM market structure and economics\n- Revenue concentration: Abbott 56.74%, Dexcom\
          \ 35.20%, Medtronic 6.88% (2024 revenue share); CAGR 2026–2031 ~15.42%, driven by miniaturization, reimbursement,\
          \ and device–software bundling ([Mordor Intelligence—CGM, 2026](https://www.mordorintelligence.com/industry-reports/continuous-glucose-monitoring-market)).\n\
          \n2) Printed electronics in healthcare (2025–2031)\n- Type shares/CAGR: printed biosensors 41.35% share (2025);\
          \ stretchable/flexible hybrid 16.02% CAGR to 2031\n- Printing process: screen printing 52.25% (2025); aerosol jet/3D\
          \ print CAGR ~14.46% to 2031 ([Mordor Intelligence—printed, 2026](https://www.mordorintelligence.com/industry-reports/global-printed-electronics-market-in-healthcare-industry)).\n\
          \n3) CDMO market growth and margin proxy\n- Market CAGR: ~9.5–10.9% through 2030–2034\n- Operating margin proxy:\
          \ Flex adjusted 6.5% in Q3 FY2026 ([HTF MI, 2026](https://www.htfmarketinsights.com/report/4418133-medical-device-contract-manufacturing-global);\
          \ [MarketsandMarkets, 2026](https://www.marketsandmarkets.com/Market-Reports/medical-device-contract-manufacturing-market-170622851.html);\
          \ [Flex IR, 2026](https://investors.flex.com/news/news-details/2026/FLEX-REPORTS-THIRD-QUARTER-FISCAL-2026-RESULTS/default.aspx)).\n\
          \n4) Upstream MLCC supplier concentration and medical documentation requirements\n- Six suppliers ~70% shipments;\
          \ ISO 13485 revisions and IEC 60601 push component-level traceability and sterilization compatibility documentation\
          \ ([Mordor Intelligence—MLCC, 2026](https://www.mordorintelligence.com/industry-reports/medical-devices-mlcc-market)).\n\
          \nBy aligning to these value pools and control points, LGIT can position its fine-line flexible substrate technology\
          \ as a scarce, high-reliability enabling layer that reduces OEM risk and time-to-market in the most demanding medtech\
