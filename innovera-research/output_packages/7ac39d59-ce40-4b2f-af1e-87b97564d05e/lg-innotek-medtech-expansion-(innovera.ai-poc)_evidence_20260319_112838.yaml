    MR-03:
      category_name: Segments & Concentration
      status: success
      findings:
        raw_report_text: "Title: Advanced Medical Device Substrates for CGM, Neurostimulation, and BCI: Market Segmentation,\
          \ Concentration, and Buyer Dynamics for a B2B Component/CDMO Entry\n\nExecutive summary\n\nThis report analyzes\
          \ where a high‑precision flexible substrate manufacturer such as LG Innotek (LGIT) can defensibly participate in\
          \ the medical devices value chain for three high‑value categories—continuous glucose monitoring (CGM), neurostimulation,\
          \ and brain–computer interfaces (BCIs)—and how the markets segment, concentrate, and buy. We synthesize technical\
          \ evidence from peer‑reviewed literature on electrode and flexible substrate requirements with market structure\
          \ and growth data across BCI and medical device contract manufacturing to identify the most attractive subsegments,\
          \ buyer roles, and concentration risks.\n\nKey findings\n\n- Segment size and growth. The global BCI market is projected\
          \ at roughly US$2.40B in 2025, growing to US$6.16B by 2032 (14.4% CAGR), with non‑invasive solutions comprising\
          \ ~60% of 2025 revenues; implantable BCI implants alone are estimated at US$351.3M in 2025 growing to US$1.18B in\
          \ 2035 (12.9% CAGR) ([Coherent Market Insights, 2025](https://finance.yahoo.com/news/brain-computer-interface-market-poised-141800272.html);\
          \ [Future Market Insights, 2025](https://www.futuremarketinsights.com/reports/brain-computer-interface-implant-market)).\
          \ The wearable patch market (a proxy for CGM/adhesive electronics and related substrates) is estimated between US$12.16B\
          \ and US$13.12B in 2025 and projected to US$24.75B by 2034 (8.26% CAGR), with connected patches accounting for ~65%\
          \ by 2025–2032 ([Straits Research, 2025](https://straitsresearch.com/report/wearable-patch-market); [Coherent Market\
          \ Insights, 2025](https://www.coherentmarketinsights.com/market-insight/wearable-patch-market-2891)). Medical EMS/ODM\
          \ and ISO 13485 contract manufacturing for healthcare are growing at ~7–8% CAGR globally, underpinning sustained\
          \ outsourcing demand and opening a CDMO path for new entrants ([Market.us, 2025](https://market.us/report/ems-odm-market/);\
          \ [Mordor Intelligence, 2026](https://www.mordorintelligence.com/industry-reports/electronic-manufacturing-services-for-healthcare-and-medical-device-market)).\n\
          - Technical pull for flexible, high‑density substrates. Modern neuroelectrode systems increasingly rely on biocompatible\
          \ flexible polymers (polyimide, parylene C) and high‑density metallization (e.g., Pt, IrOx, TiN; PEDOT:PSS) to reduce\
          \ tissue damage, impedance, and chronic failure—creating demand for 10‑µm‑class lithography, multilayer flexible\
          \ interconnects, and stable encapsulation stacks ([Nature Biomedical Engineering, 2023](https://www.nature.com/articles/s41551-023-01021-5);\
          \ [Nature Communications, 2023](https://www.nature.com/articles/s41467-023-43727-9); [Frontiers in Neuroscience,\
          \ 2024](https://www.frontiersin.org/journals/neuroscience/articles/10.3389/fnins.2024.1348434/full); [Lab on a Chip/RSC,\
          \ 2025](https://pubs.rsc.org/en/content/articlehtml/2025/lc/d5lc00058k)). Flexible micro‑ECoG and depth arrays (e.g.,\
          \ µSEEG) explicitly use polyimide/parylene C substrates and PEDOT:PSS to capture higher‑fidelity signals with lower\
          \ tissue disruption than traditional cylindrical electrodes—matching LGIT’s thin‑film strengths ([Nature Communications,\
          \ 2023](https://www.nature.com/articles/s41467-023-43727-9)).\n- Demand concentration and buyer power. For implantable\
          \ neuro devices, spend concentrates among a short list of OEMs (Medtronic, Boston Scientific, Abbott Neuromodulation,\
          \ Synchron, Neuralink/Blackrock/Paradromics/Precision), large IDNs/hospitals as end‑users, and a handful of ISO\
          \ 13485 CDMOs. EMS/ODM markets are moderately concentrated (top five ~55% share), and OEMs show low “stickiness”\
          \ to any one supplier—indicating strong buyer leverage and price pressure for undifferentiated components ([BusinessResearchInsights,\
          \ 2026](https://www.businessresearchinsights.com/market-reports/ems-and-odm-market-120174); [VentureOutsource, n.d.](https://ventureoutsource.com/contract-manufacturing/first-tier-ems-odm-consolidation-why-manufacturing-merger-acquisition-not-happening)).\n\
          - Strategic implication for LGIT. The fastest, lower‑risk entry point is B2B component modules for connected CGM/patch‑type\
          \ devices (flex circuits, CoF interposers, antennas/inductors, stacked sensor interconnects) while parallel‑building\
          \ a medical QMS and ISO 13485 line. A near‑adjacent step is neuromodulation lead bodies and paddle/µECoG electrode‑substrate\
          \ modules co‑developed with OEMs or via a CDMO JV. A longer‑horizon bet is flexible intracranial arrays (µECoG/µSEEG)\
          \ where substrate/microfabrication quality materially drives device performance and switching costs ([Nature Biomedical\
          \ Engineering, 2023](https://www.nature.com/articles/s41551-023-01021-5); [Nature Communications, 2023](https://www.nature.com/articles/s41467-023-43727-9);\
          \ [Frontiers, 2024](https://www.frontiersin.org/journals/neuroscience/articles/10.3389/fnins.2024.1348434/full)).\n\
          \nMethods and source notes\n\n- Technical requirements and translational risks for invasive electrodes are sourced\
          \ from Nature Biomedical Engineering (2023) and complementary peer‑reviewed reviews (Frontiers in Neuroscience,\
          \ 2024; Lab on a Chip/RSC, 2025), emphasizing materials stacks, impedance, chronic stability, and substrate adhesion/encapsulation\
          \ evidence ([Nature Biomedical Engineering, 2023](https://www.nature.com/articles/s41551-023-01021-5); [Frontiers,\
          \ 2024](https://www.frontiersin.org/journals/neuroscience/articles/10.3389/fnins.2024.1348434/full); [Lab on a Chip/RSC,\
          \ 2025](https://pubs.rsc.org/en/content/articlehtml/2025/lc/d5lc00058k)).\n- Market sizing and growth rates are\
          \ triangulated from multiple analyst houses and press releases; ranges and discrepancies are explicitly noted where\
          \ applicable (e.g., BCI total market: CMI vs IDTechEx; wearable patches: Straits vs Global Info Research). EMS/ODM\
          \ for medical devices is sourced from Mordor Intelligence and market/press data pointing to nearshoring/consolidation\
          \ dynamics ([Coherent Market Insights, 2025](https://finance.yahoo.com/news/brain-computer-interface-market-poised-141800272.html);\
          \ [Future Market Insights, 2025](https://www.futuremarketinsights.com/reports/brain-computer-interface-implant-market);\
          \ [Straits Research, 2025](https://straitsresearch.com/report/wearable-patch-market); [Mordor Intelligence, 2026](https://www.mordorintelligence.com/industry-reports/electronic-manufacturing-services-for-healthcare-and-medical-device-market)).\n\
          - Buyer role mapping is inferred from industry practice in combination with end‑user/end‑market focus reported by\
          \ Precedence, CMI, and FMI; we mark these inferences where appropriate ([Precedence Research, 2025](https://www.precedenceresearch.com/us-brain-computer-interface-market);\
          \ [Coherent Market Insights, 2025](https://finance.yahoo.com/news/brain-computer-interface-market-poised-141800272.html);\
          \ [Future Market Insights, 2025](https://www.futuremarketinsights.com/reports/brain-computer-interface-implant-market)).\n\
          \nA. Segment taxonomy\n\nA1. Segmentation scheme supported by public data\n\nPublic sources support the following\
          \ usable schemes for LGIT’s opportunity set (components/CDMO for CGM, neurostimulation, BCI). We include the fields\
          \ for which public data is reported; items marked “inferred” are common in practice but not explicitly quantified\
          \ in the sources.\n\n- By product/category\n  - BCI: invasive, minimally invasive/endovascular, non‑invasive; by\
