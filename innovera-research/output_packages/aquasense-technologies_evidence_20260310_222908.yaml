          \ leak-related non-revenue-water as regulatory focal point. (Motley Fool transcript)  \nXylem (NYSE:XYL) | FY-2025\
          \ presentation (Feb-2026) | Reiterated double-digit growth in “digital solutions” unit driven by Visenti/Pure leak-detection\
          \ platform. (Company IR slide deck)  \n\n────────────────────────────────────────  \n6.  COMPETITOR FUNDING HISTORIES\
          \ (selected)  \n\nCompetitor | Last Known Equity Raise | Amount | Year | Status / Notes  \n---|---|---|---|--- \
          \ \nFIDO Tech (UK) | Series B | $6.2 M | 2024 | Live deployments with United Utilities, Yorkshire Water. (Tracxn)\
          \  \nFracta (US) | Series A $3.7 M (2017) → Acquired by Kurita 2020; full integration 2024 | — | Now Kurita Fracta,\
          \ serving >100 U.S. utilities.  \nXylem Digital (Visenti, Pure Tech) | N/A – acquired | $50 M+ aggregate prior to\
          \ acquisitions | 2018/2021 | Folded into Xylem Analytics; provides inline acoustic & satellite leak analytics. \
          \ \nMueller Water Products (NYSE:MWA) – Echologics | N/A – internal | — | Mueller purchased IP in 2011; continues\
          \ R&D spend, referenced in FY-2025 10-K as “Smart Infrastructure” growth pillar.  \nKurita Water Industries – Fracta\
          \ | see above | — | Kurita using Fracta AI to sell leak-risk SaaS in Japan & U.S.  \n\n────────────────────────────────────────\
          \  \n7.  SUMMARY INSIGHT  \n\n• Deal flow remains active but ticket sizes are still modest (<$20 M), reflecting\
          \ utilities’ slow adoption cycles.  \n• Regulatory deadlines in the U.S. (EPA LCRR, CA SB 555) and EU pressure on\
          \ non-revenue water are beginning to convert into commercial pilots, attracting infrastructure-focused VCs and corporate\
          \ strategics.  \n• Consolidation has begun (Smartvatten-LeakLook) as platforms seek geographic scale and data-network\
          \ effects.  \n• Incumbent OEMs (Xylem, Mueller) prefer buy-vs-build and continue to act as likely exits for Series\
          \ B/C companies.  \n• For a new entrant, near-term capital availability looks favorable, especially from corporate/infra\
          \ funds seeking ESG-aligned opportunities, though proving scalable ARR inside conservative utilities remains the\
          \ gating factor."
