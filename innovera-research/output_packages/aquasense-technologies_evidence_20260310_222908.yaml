    problem_summary: Municipal water utilities in North America lose 20-30% of treated water through leaks in aging pipe networks,
      costing the industry an estimated $2.6 billion annually in non-revenue water. Current detection methods are overwhelmingly
      manual and reactive — field crews can inspect only 2-5 miles of pipe per day, and most utilities discover leaks only
      after visible surface damage or catastrophic failures. Regulatory mandates (EPA LCRR, California SB 555) are now creating
      hard compliance deadlines for water loss auditing, while an aging utility workforce is accelerating operational risk.
    solution_summary: AquaSense Technologies deploys networks of low-power IoT acoustic sensors on existing water mains (no
      excavation required) that continuously monitor pipe vibration signatures to detect and classify leaks in real time.
      A cloud-based AI/ML platform analyzes sensor data to predict pipe failure probability, prioritize maintenance work orders
      by risk score, and integrate with existing SCADA and GIS systems. The platform also auto-generates compliance reports
      for AWWA water audits, delivered via SaaS subscription bundled with a sensor hardware lease.
    target_customer_summary: Primary customers are mid-sized municipal water utilities in the US serving populations of 50,000
      to 500,000 (approximately 1,200 utilities), which face significant water loss but lack the resources to build proprietary
      monitoring systems. Secondary targets include industrial facilities with critical water infrastructure such as food/beverage
      manufacturers, data centers, and pharmaceutical plants.
