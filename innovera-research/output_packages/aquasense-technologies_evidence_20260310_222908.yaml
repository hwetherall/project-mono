        raw_report_text: "IoT-ENABLED AI LEAK DETECTION & PIPE MONITORING  \n(Water Infrastructure / Utilities Focus)\n\n\
          All $ figures are nominal. “—” means not disclosed in source.  \nSources are dated 2023-2025 unless stated. n/a\
          \ = not available.\n\n────────────────────────────────────────\n1. TOTAL ADDRESSABLE MARKET (TAM)\n────────────────────────────────────────\n\
          A. Multi-industry leak detection platforms (oil & gas, water, chem., etc.)\n• Global Leak Detection Market = US\
          \ $22.13 B (2025); projected US $34.01 B by 2035  \n  CAGR = 4.4 % (BusinessResearchInsights, “Leak Detection Market\
          \ 2026-2035”, 2024).\n\n• Global Pipeline Monitoring System Market = US $16.43 B (2024); projected US $38.36 B by\
          \ 2033  \n  CAGR = 10.3 % (Grand View Research, “Pipeline Monitoring System Market Report 2033”, 2024).\n\nB. Water-only\
          \ digital solutions (meters, analytics, leak detection, pressure mgmt.)\n• Global Smart Water Management Market\
          \  \n  – US $20.74 B (2026) → US $37.43 B (2031); CAGR 12.54 % (Mordor Intelligence, 2024).  \n  – US $19.9 B (2025)\
          \ → US $23.0 B (2026); CAGR 15.6 % (Research & Markets, 2025).  \n  – US $28.2 B by 2028 (MarketsandMarkets, Sept-2023).\n\
          \nC. Share represented by “water pipeline monitoring & leak detection” inside Smart Water Management\n• Typically\
          \ 22-28 % of SWM spend (TaKaDu, Badger Meter, Xylem investor decks; corroborated by Mordor vertical splits).  \n\
          \  Applying 25 % to the three global SWM baselines gives an “IoT/AI leak detection in water” TAM range of:\n\n \
          \ 2025/26: US $5.0 B – US $7.1 B  \n  2030/31: US $9.4 B – US $11.2 B\n\n────────────────────────────────────────\n\
          2. MARKET GROWTH RATE\n────────────────────────────────────────\n• Leak detection (all sectors) 2025-35 CAGR 4.4\
          \ % (BusinessResearchInsights, 2024).  \n• Pipeline monitoring systems 2025-33 CAGR 10.3 % (Grand View, 2024). \
          \ \n• Smart water management 2026-31 CAGR 12.5 % (Mordor, 2024) / 2025-30 CAGR 15.3 % (R&M, 2025).  \n• Portable\
          \ water leak detector devices 2026-35 CAGR — but “fastest-growing” tag on Europe & APAC (GMI Insights, 2024).\n\n\
          Consensus for the water-specific, IoT-centric leak-detection slice: 11-15 % CAGR through 2030.\n\n────────────────────────────────────────\n\
          3. SERVICEABLE ADDRESSABLE MARKET (SAM)\n────────────────────────────────────────\nA. North America   \n• NA holds\
          \ 34.71 % of global SWM revenue (Mordor, 2025)  \n  \n  2026 NA SAM ≈ 34.71 % × US $20.74 B × 25 % leak-detection\
          \ share  \n  = ~US $1.8 B\n\n• BusinessResearchInsights notes that “North America accounts for 40 %+ of global leak-detection\
          \ tech adoption” (2024).  \n  40 % × mid-point US $6.0 B 2026 TAM ≈ US $2.4 B\n\nRange: US $1.8 B – US $2.4 B (2026)\
          \ for water-utility leak detection in NA.\n\nB. European Union (planned expansion)  \n• Europe ~31 % of SWM spend\
          \ (average of Mordor & R&M dashboards).  \n  2026 EU SAM = 31 % × US $20.74 B × 25 % ≈ US $1.6 B\n\n────────────────────────────────────────\n\
          4. MARKET STRUCTURE\n────────────────────────────────────────\n• Fragmented but consolidating. Top 10 vendors control\
          \ 35-40 % market share (BusinessResearchInsights, 2024).  \n• Largest revenue generators in water leak detection:\
          \ Xylem (Echologics & Visenti), Badger Meter, Mueller Water Products (Syrinix, i2O), Itron, Honeywell Elster, Schneider\
          \ Electric (AVEVA), Trimble Water, TaKaDu, Ketos.  \n• Wave of M&A: Badger-SmartCover (Jan 2025), Mueller-Syrinix\
          \ (2023), Xylem-Evoqua (2023).  \n• Numerous VC-backed entrants (Utilis/ASTERRA, Fracta, Ayyeka, FIDO Tech) keep\
          \ space innovative.  \nStatus: Emerging/high-growth niche inside a broader mature utility-tech market.\n\n────────────────────────────────────────\n\
          5. CONTEXTUAL INDUSTRY DATA\n────────────────────────────────────────\nNorth America\n• 50,000+ community water\
          \ systems; c. 1,400 serve >50k population (EPA SDWIS, 2023).  \n• AWWA & ASCE estimate US$129 B of drinking-water\
          \ pipe replacement by 2031 and ~US$1 T by 2040 (AWWA Buried No Longer report, 2011; reconfirmed in AWWA advocacy\
          \ brief, 2024).  \n• NA pipeline monitoring sys. market share 27.6 % in 2024 (Grand View).  \n• “Over 50 % of North-American\
          \ utilities have deployed advanced monitoring systems” (BusinessResearchInsights, 2024).\n\nEuropean Union\n• EU\
          \ water utilities spend €45-55 B/yr on network O&M & capex (EurEau, 2022).  \n• EU NRW averages 23 %; several member\
          \ states facing 25-35 % (European Commission Water Reuse report, 2023).  \n• Digital Europe Programme earmarked\
          \ €80 M for smart water pilots 2024-27.\n\n────────────────────────────────────────\n6. VENTURE CLAIMS – VERIFICATION\n\
          ────────────────────────────────────────\nClaim 1 – “Global smart water management market valued at $15.7 B by 2027\
          \ (MarketsandMarkets)”  \n• MarketsandMarkets’ latest figure is US $28.2 B by 2028 (Sept-2023). An older 2019 edition\
          \ quoted ~US $15.2 B by 2024.  \n  ➔ Updated research shows a higher number; 15.7 B is plausible only for an earlier\
          \ baseline year.\n\nClaim 2 – “Non-revenue water costs US utilities $2.6 B/year”  \n• Widely cited AWWA stat: 1.7\
          \ T gallons lost annually worth ≈US $2.6 B (AWWA Water Loss Control Committee, 2022).  \n  ➔ Supported.\n\nClaim\
          \ 3 – “≈1,200 mid-sized municipal utilities (50k-500k population) in the US”  \n• EPA SDWIS lists 1,393 community\
          \ water systems in the 50k-500k bracket (2023).  \n  ➔ Reasonable.\n\nClaim 4 – “Target ACV of $75k-$250k per utility\
          \ customer”  \n• Benchmarks:  \n  – TaKaDu SaaS ≈US $1.0-$1.5 per connection/yr. A 100k-meter city ≈US $100-150k.\
          \  \n  – Echologics managed acoustic districts: US $0.80-$1.20 per foot/yr. Typical 100-mile DMA ≈US $80-120k. \
          \ \n  ➔ Range is realistic.\n\nClaim 5 – “AWWA estimates $1 T infrastructure investment needed over 25 yrs”  \n\
          • AWWA “Buried No Longer” (2011) projected US $1.0-$1.7 T through 2040; reiterated 2024.  \n  ➔ Supported.\n\n────────────────────────────────────────\n\
          7. INSTALLED BASE SNAPSHOT\n────────────────────────────────────────\nNorth America\n• “40 %+ of utilities have\
          \ adopted IoT/advanced monitoring” (BusinessResearchInsights, 2024).  \n• Smart home market: >30 % of new U.S. homes\
          \ already include a leak sensor; forecast 50 % by 2027 (TechSciResearch, 2024).  \n• City-wide deployments:  \n\
          \  – Toronto: 550 pressure/Acoustic sensors (Echologics, 2023)  \n  – San Antonio SAWS: 250k AMI meters with leak\
          \ analytics layer (Badger, 2024)\n\nEuropean Union\n• UK: >500,000 acoustic loggers via Thames, Severn, Anglian\
          \ (Ofwat PR24 submissions, 2024).  \n• France: SUEZ ON’Connect >1.5 M IoT meters (SUEZ press kit, 2024).  \n• Spain:\
          \ Canal de Isabel II – 7,400 district meters feeding TaKaDu since 2022.\n\n────────────────────────────────────────\n\
          SIGNIFICANT VARIANCES & DATA GAPS\n────────────────────────────────────────\n• TAM figures vary depending on whether\
          \ oil & gas is included (4-5 % CAGR) or only water (11-15 % CAGR).  \n• Leak-detection share of SWM (22-28 %) is\
          \ mostly derived from vendor revenue splits; few analyst reports publish it explicitly.  \n• Latest primary research\
          \ on installed base is sparse; most numbers come from utility case studies or vendor presentations, not syndicated\
          \ market reports.\n\n────────────────────────────────────────\nBOTTOM LINE\nThe IoT-enabled, AI-based leak-detection\
          \ opportunity in water utilities is a US $5-7 B global niche today, growing low-to-mid-teens annually. North America\
          \ represents roughly US $2 B of near-term SAM, Europe ~US $1.6 B, with regulatory pressure, aging infrastructure\
          \ and workforce constraints acting as strong catalysts. Market is still fragmented, allowing new entrants room to\
          \ capture share with differentiated analytics, SaaS delivery, or sensor innovations."
