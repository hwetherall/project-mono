      findings:
        raw_report_text: "Title: Flexible Substrate and Electrode Components for Medical Devices (CGM, Neurostimulation, BCI):\
          \ Route-to-Market, Access Gates, Adoption, and SAM/SOM Sizing for North America and Europe (with Global Expansion\
          \ Outlook)\n\nExecutive Summary\n\n- Initial SAM (North America + Europe, 2026): Approximately $2.1–$3.3 billion\
          \ component revenue across continuous glucose monitoring (CGM), implantable and wearable neurostimulation, and early-stage\
          \ brain–computer interface (BCI) electrode needs. This is derived by applying conservative component bill-of-materials\
          \ (BOM) shares to published device-market sizes for 2026 and allocating regional shares per publicly available regional\
          \ splits where available; assumptions and uncertainty bands are explicitly noted (see Section D). Evidence sources:\
          \ CGM global market to $15.33B in 2026 with North America leading; implantable neurostimulation $7.51B global in\
          \ 2026 (with North America ≈41.7% share); wearable neurostimulation CAGR 13.3% to 2032 (back-solving to ~2026);\
          \ flexible implantable electrode market indicative of BCI/electrode niche scale (details with citations in Section\
          \ D) ([Mordor Intelligence, 2026](https://www.mordorintelligence.com/industry-reports/continuous-glucose-monitoring-market);\
          \ [DIResearch, 2026](https://www.marketresearch.com/Deep-Insights-Research-Co-DIR-v4285/Global-Implantable-Neurostimulation-Devices-Competitive-43881006);\
          \ [Acumen, 2026](https://www.acumenresearchandconsulting.com/wearable-neurostimulation-devices-market); [Research\
          \ and Markets, 2026](https://www.researchandmarkets.com/reports/6226271/flexible-implantable-electrode-market-report?srsltid=AfmBOor8dsx_llOQDaZ7BkgAiK3Qzdjc37nW7mg6sN1USg87qlzXCOfO)).\n\
          \n- Global SAM (2026): Approximately $2.8–$4.0 billion component revenue potential, using the same component-share\
          \ methodology on global device markets and an emerging BCI electrode “wedge” (Section D) ([Mordor Intelligence,\
          \ 2026](https://www.mordorintelligence.com/industry-reports/continuous-glucose-monitoring-market); [DIResearch,\
          \ 2026](https://www.marketresearch.com/Deep-Insights-Research-Co-DIR-v4285/Global-Implantable-Neurostimulation-Devices-Competitive-43881006);\
          \ [Acumen, 2026](https://www.acumenresearchandconsulting.com/wearable-neurostimulation-devices-market); [Research\
          \ and Markets, 2026](https://www.researchandmarkets.com/reports/6226271/flexible-implantable-electrode-market-report?srsltid=AfmBOor8dsx_llOQDaZ7BkgAiK3Qzdjc37nW7mg6sN1USg87qlzXCOfO)).\n\
          \n- Initial SOM (24–36 months, North America + Europe): $25–45 million with disciplined, audit-ready entry focused\
          \ on CGM electrodes/FPC substrates (Class II supply chains), Tier-1 supplier onboarding (ASL/AVL), and one anchor\
          \ CDMO/OEM program; 0.5–1.0% share of the initial SAM is realistic given stringent supplier controls and change-control\
          \ inertia in medical devices (Section D). Stronger five-year scenarios with two anchor OEMs and at least one CDMO\
          \ master service agreement could reach 2–4% share ($80–130 million) in NA+EU before APAC scale-up (Section D). Justification:\
          \ supplier controls under FDA QMSR (effective 2026), ISO 13485-aligned QMS expectations, and EU MDR notified-body\
          \ audit clauses formalize high-friction onboarding with multi-quarter timelines; switching components often triggers\
          \ new submissions (or supplements), slowing vendor changeovers ([U.S. FDA, 2024](https://www.federalregister.gov/documents/2024/02/02/2024-01709/medical-devices-quality-system-regulation-amendments);\
          \ [Greenlight Guru, 2024–2025](https://www.greenlight.guru/blog/approved-supplier-list); [Matric, 2026](https://www.matric.com/medical-device-supply-chain)).\n\
          \n- Defensible differentiation for LG Innotek (LGIT): LGIT’s wafer-level/fine-pattern competencies (10 µm photolithography,\
          \ flexible FPCB, roll-to-roll) map directly to emerging needs in:\n  - High-density, thin-film, biocompatible electrode\
          \ arrays (PEDOT/Pt/Au thin films on polymers like parylene C, PI), including conformal/stretchable geometries for\
          \ wearables and implantables ([Microsystems & Nanoengineering, 2024](https://www.nature.com/articles/s41378-024-00685-6);\
          \ [Microsystems & Nanoengineering, 2021](https://www.nature.com/articles/s41378-021-00271-0)).\n  - CGM electrochemical\
          \ sensor structures where integration of flexible substrate, precision electrodes, and thin-film stacks determines\
          \ accuracy and wear-time (e.g., Ni–Co MOF-coated Au/PDMS electrodes, textile-integrated potentiostat on polyimide)\
          \ ([RSC Analyst, 2022](https://pubs.rsc.org/en/content/articlelanding/2022/an/d1an02214h); [bioRxiv, 2026](https://www.biorxiv.org/content/10.64898/2026.02.24.707657v1.full.pdf)).\n\
          \  - Neural interfaces and BCI where high-density microelectrode arrays, flexible shanks, and conformal leads require\
          \ fine lithography and robust polymer–metal stacks (Pt/Au on parylene C) ([Microsystems & Nanoengineering, 2024](https://www.nature.com/articles/s41378-024-00685-6)).\n\
          \n- Go-to-market priority: Component/module-level entry via OEM/CDMO channels is strongly favored over launching\
          \ integrated finished devices. Evidence: supplier audit and ASL/AVL gatekeeping; FDA QMSR makes supplier audit reports\
          \ inspectable (especially for PMA/implantables), increasing the premium on proven controls; device-level entry would\
          \ trigger 510(k)/PMA or EU MDR Notified Body CE-mark processes that are far costlier and slower to market (6–18+\
          \ months and $0.5–$5+ million), whereas component-level revenue can begin post-onboarding and PPAP-like validation\
          \ with OEM/CDMO customers (Sections A–C; cost/timing sources cited) ([FDLI, 2025](https://www.fdli.org/2025/12/the-qmsr-transition-new-fda-guidance-and-their-impacts-on-active-implantable-medical-devices/);\
          \ [Complizen, 2025](https://www.complizen.ai/post/eu-mdr-vs-fda-complete-regulatory-comparison-guide-2025); [AJProTech,\
          \ 2026](https://ajprotech.com/blog/guides-and-templates/medical-devices-compliance-guide-cost-analysis-budget-strategies-and-fda-and-iso-requirements.html)).\n\
          \n- Market reachability: High but gated. Success requires (1) ISO 13485–aligned QMS readiness ahead of the 2026\
          \ QMSR effective date (FDA will inspect per QMSR; ISO certificates are not mandatory but increasingly expected by\
          \ OEMs); (2) supplier agreements with explicit audit rights (per MDR/NBOG and MDSAP practices); (3) demonstrated\
          \ materials compliance (RoHS/REACH; biocompatibility/ISO 10993) and device-class-appropriate EMC/safety testing\
          \ readiness for modules; and (4) a risk-tiered supplier auditing program to satisfy OEM purchasing controls and\
          \ Notified Body expectations (Sections B–C) ([U.S. FDA, 2024; 2025](https://www.federalregister.gov/documents/2024/02/02/2024-01709/medical-devices-quality-system-regulation-amendments);\
          \ [Greenlight Guru, 2024–2025](https://www.greenlight.guru/blog/approved-supplier-list); [European-Standards.com,\
          \ 2026](https://european-standards.com/medical-devices-healthcare-equipment-standards/); [UL Solutions, 2026](https://www.ul.com/news/global-market-access-regulatory-newsletter-q4-2025);\
          \ [Nemko, 2025](https://www.nemko.com/blog/some-recent-and-upcoming-regulatory-changes-in-china); [Measurlabs, 2026](https://measurlabs.com/blog/eu-mdr-medical-device-regulation/)).\n\
          \nA. Route-to-Market and Channel Structure\n\nA1. Dominant route-to-market types and why they dominate\n\n- Direct\
          \ OEM enterprise sales (dominant): Finished-device manufacturers (e.g., Dexcom, Abbott, Medtronic, Boston Scientific)\
          \ must qualify and control “critical suppliers” under written purchasing controls. Under the FDA’s QMSR (effective\
          \ Feb 2, 2026), FDA explicitly notes that while QMSR provisions do not apply directly to component manufacturers,\
          \ finished device manufacturers must assess supplier capability, and certification alone “may not provide adequate\
          \ assurances … without further evaluation.” FDA also states supplier controls can be achieved via audits, review\
          \ of historical data, monitoring/trending, and product testing—requiring bilateral, often long-term, direct relationships\
          \ rather than transactional procurement ([FDA, 2024](https://www.federalregister.gov/documents/2024/02/02/2024-01709/medical-devices-quality-system-regulation-amendments)).\n\
          \n- CDMO partnerships (co-dominant for many OEMs, especially startups): The medical device CDMO market is expanding\
          \ rapidly as OEMs outsource complex subassemblies and components. Integrated CDMOs like Jabil, Flex, Phillips-Medisize,\
          \ Integer, Viant, Sanmina, and Celestica provide mechatronics, microfabrication, assembly, sterilization, and supply-chain\
          \ services. OEMs increasingly rely on CDMOs for specialist flexible electronics and electrode capabilities, making\
          \ CDMOs essential channel partners for component suppliers that can slot into their qualified supply chains ([CSG\
          \ Talent, 2026](https://www.csgtalent.com/insights/blog/medical-devices-cdmo-market-2026/); [LinkedIn CDMO Market\
          \ Leaders, 2026](https://www.linkedin.com/pulse/medical-device-cdmo-market-size-2026-ai-technology-outlook-ydugc/)).\n\
          \n- Inclusion on Approved Supplier Lists (ASL)/Approved Vendor Lists (AVL) (gating mechanism, not a sales route\
          \ per se): Medical device companies must maintain ASL procedures under FDA QSR/QMSR and ISO 13485, and suppliers\
          \ are added following risk-based qualification, questionnaires, audits (especially Tier 1/Tier 2), and quality agreements\
          \ with audit clauses (per MDR/NBOG expectations). This gate means enterprise-direct and CDMO-led routes require\
          \ formal onboarding before revenue flows; component deals rarely occur through marketplaces because procurement\
          \ must be auditable and compliant ([Definitive Healthcare, n.d.](https://www.definitivehc.com/resources/glossary/approved-supplier-list);\
          \ [Greenlight Guru, 2025](https://www.greenlight.guru/blog/approved-supplier-list)).\n\n- Marketplaces/self-serve\
          \ (marginal for critical components): While consumer electronics often leverage marketplaces, critical medical components—especially\
          \ those contacting the body or in implantables—are qualified through controlled supply chains with ASL/AVL, change-control,\
          \ and periodic audits, which are incompatible with anonymous marketplaces. OEMs must be able to demonstrate supplier\
          \ control to regulators and Notified Bodies; supplier agreements often grant Notified Body audit access to the supplier\
          \ itself (per NBOG guidance), further reinforcing direct or CDMO-mediated channels ([Greenlight Guru, 2025](https://www.greenlight.guru/blog/approved-supplier-list)).\n\
          \nA2. Channel share and segment coverage (estimates with rationale)\n\n- Given the regulatory structure:\n  - Direct\
          \ enterprise sales into OEM purchasing/account (≈50–60% of component revenue): Favored by large OEMs with internal\
          \ device engineering and existing vertically integrated supply chains; best for CGM electrodes/FPC substrates and\
          \ implantable lead arrays where design co-development and reliability data are needed. Evidence: the need for OEM\
          \ purchasing controls and supplier audits; PMA submissions may reference supplier selection and audits, and FDA\
          \ can inspect supplier audit reports under QMSR ([FDLI, 2025](https://www.fdli.org/2025/12/the-qmsr-transition-new-fda-guidance-and-their-impacts-on-active-implantable-medical-devices/)).\
          \ Estimate is analyst inference supported by supplier-control obligations.\n\n  - CDMO-led channel (≈35–45%): CDMOs\
          \ aggregate demand from multiple OEMs (startups to large enterprises); their share is growing as OEMs outsource\
          \ complex fabrication and assembly of mechatronic subsystems. CDMOs increasingly shape design-for-manufacture and\
          \ integrate flexible substrates/electrodes in modules (e.g., sensor patches, lead assemblies). Evidence: CDMO market\
          \ growth and OEM reliance for electromechanical integration; 41%+ of neurostimulation and many wearables rely on\
          \ high-precision mechatronics, historically a CDMO strength ([CSG Talent, 2026](https://www.csgtalent.com/insights/blog/medical-devices-cdmo-market-2026/);\
          \ [Towards Healthcare, 2026](https://www.towardshealthcare.com/insights/medical-device-cmo-and-cdmo-market-sizing)).\
          \ Estimate is analyst inference based on CDMO/OEM outsourcing trends.\n\n  - Distributors/Resellers/Marketplaces\
          \ (≤5%): Limited to non-critical catalog items (e.g., fasteners, non-patient-contact interconnects). Greenlight\
          \ Guru distinguishes “non-critical suppliers” that may not need onboarding audits and don’t necessarily go on the\
          \ ASL; these are not core to this opportunity (critical patient-contact electrodes and implantables) ([Greenlight\
          \ Guru, 2025](https://www.greenlight.guru/blog/approved-supplier-list)). Estimate is analyst inference anchored\
          \ in supplier risk-based practices.\n\nSegment best-fit per route (summary):\n- CGM electrodes/FPC for patches:\
          \ Direct OEM (Dexcom, Abbott) or via CDMOs supporting these OEMs; startups in wellness/OTC CGM (e.g., Abbott’s OTC\
          \ “Lingo”) may be addressable via CDMOs ([DataM Intelligence, 2026](https://www.datamintelligence.com/research-report/wearable-continuous-glucose-monitors-market)).\n\
          - Implantable neurostimulation leads/electrodes: Direct to Tier-1 OEMs (Medtronic, Boston Scientific, Abbott/St.\
          \ Jude, LivaNova, Nevro) and via specialist CDMOs (e.g., Integer) ([DIResearch, 2026](https://www.marketresearch.com/Deep-Insights-Research-Co-DIR-v4285/Global-Implantable-Neurostimulation-Devices-Competitive-43881006)).\n\
          - BCI/neural interfaces: Emerging OEMs and research spinouts (Neuralink, Synchron, Blackrock Neurotech) often rely\
          \ on CDMOs or university fabs; direct relationships with both OEMs and academic consortia are common ([Microsystems\
          \ & Nanoengineering, 2024](https://www.nature.com/articles/s41378-024-00685-6)).\n\nA3. Marketplace or platform\
          \ access requirements\n\n- ASL/AVL documentation and qualification: Suppliers must be added to the OEM’s ASL/AVL\
          \ via documented procedures, including supplier questionnaires, risk-tiering, and (for Tier 1 and many Tier 2) onboarding\
          \ audits; typically, ongoing audits occur every 1–2 years for Tier 1 and up to every 3 years for Tier 2. All qualification\
          \ decisions and evidence must be documented and auditable (per FDA QMSR/ISO 13485 purchasing controls) ([Greenlight\
          \ Guru, 2025](https://www.greenlight.guru/blog/approved-supplier-list)).\n\n- Quality agreements with audit clause:\
          \ Under EU MDR, Notified Bodies expect audit rights to critical suppliers. Greenlight Guru points to NBOG and MDSAP\
          \ as resources for drafting supplier agreements granting notified-body access—effectively a participation requirement\
          \ in EU supply chains ([Greenlight Guru, 2025](https://www.greenlight.guru/blog/approved-supplier-list)).\n\n- Compliance\
          \ documentation: For materials/electrical subassemblies sold as components or modules in EU and other markets, documentation\
          \ to support RoHS, REACH (and country-specific RoHS equivalents), and basic safety/EMC conformance (for active modules)\
          \ must be available. UL Solutions and Nemko report updated RoHS and global market access requirements (e.g., EU\
          \ delegated directives on lead-related exemptions applicable in 2026, China RoHS tightened limits from Jan 2026),\
          \ underscoring the need for component-level documentation and, where applicable, SDoC registrations for certain\
          \ markets ([UL Solutions, 2026](https://www.ul.com/news/global-market-access-regulatory-newsletter-q4-2025); [Source\
          \ Intelligence, 2026](https://blog.sourceintelligence.com/eu-rohs-compliance); [Nemko, 2025](https://www.nemko.com/blog/some-recent-and-upcoming-regulatory-changes-in-china)).\n\
          \nB. Access and Compliance Gates\n\nB4. Jurisdiction-specific licensing or compliance requirements (North America,\
          \ Europe; Global)\n\n- FDA QMSR (21 CFR Part 820, effective Feb 2, 2026): Harmonizes with ISO 13485:2016 by incorporating\
          \ it by reference. Manufacturers must have a QMS compliant with ISO 13485 plus FDA-specific applicable requirements\
          \ (e.g., MDR reporting, UDI, device tracking). While QMSR does not directly apply to component makers, OEMs’ purchasing\
          \ controls will require supplier evaluation, and under QMSR, FDA can inspect supplier audit reports in PMA contexts—functionally\
          \ raising the bar for supplier quality documentation and audit readiness ([FDA, 2024](https://www.federalregister.gov/documents/2024/02/02/2024-01709/medical-devices-quality-system-regulation-amendments);\
          \ [FDLI, 2025](https://www.fdli.org/2025/12/the-qmsr-transition-new-fda-guidance-and-their-impacts-on-active-implantable-medical-devices/);\
          \ [AAMI, 2026](https://aami.org/news/qmsr-understanding-part-820-10-requirements-for-a-quality-management-system-and-the-applicable-regulatory-requirements/)).\n\
          \n- ISO 13485 alignment and expectations: The FDA clarified it will not require ISO 13485 certification and will\
          \ not issue ISO certificates via inspections. However, many OEMs will expect ISO 13485–certified suppliers for critical\
          \ components as a “security blanket,” especially post-QMSR alignment. European OEMs and Notified Bodies under MDR/IVDR\
          \ already expect ISO 13485 across critical suppliers ([Compliancenavigator/BSI, 2026](https://compliancenavigator.bsigroup.com/en/medicaldeviceblog/the-new-fda-21-cfr-part-820--quality-management-system-regulation/);\
          \ [Degrandson, 2025](https://info.degrandson.com/blog/iso-13485-requirements-medical-device-suppliers)).\n\n- EU\
          \ MDR (2017/745) supplier ecosystem requirements: Importers and distributors have legal obligations (Articles 13\
          \ and 14), including verifying CE marking, EU Declaration of Conformity, UDI assignment, and labeling—making supply-chain\
          \ compliance auditable beyond the manufacturer. While component suppliers are upstream of these roles, MDR implementation\
          \ (and MDCG Q&A) drives OEMs and Notified Bodies to push audit rights and traceability into critical supplier agreements\
          \ ([Medical Device Regulation EU—Articles 13 & 14](https://www.medical-device-regulation.eu/mdr-article-13-general-obligations-of-importers/);\
          \ [RegDesk, 2024](https://www.regdesk.co/blog/mdcg-guidance-on-articles-13-14-of-mdr-and-ivdr-obligations/)).\n\n\
          - Biocompatibility and safety standards: For patient-contact electrodes, ISO 10993 biological evaluation applies;\
          \ for active modules, IEC 60601 series (EMC/safety) and, for breathing gas interfaces, ISO 18562, are relevant.\
          \ MDR uses “harmonized standards” as conformity references; suppliers must support OEMs with test data and material\
          \ declarations to accelerate conformity assessments ([European-Standards.com, 2026](https://european-standards.com/medical-devices-healthcare-equipment-standards/);\
          \ [Measurlabs, 2026](https://measurlabs.com/blog/eu-mdr-medical-device-regulation/)).\n\n- Restriction of Hazardous\
          \ Substances (RoHS) and REACH: EU RoHS delegated directives revise certain lead exemptions taking effect in 2026;\
          \ the EU has shifted scientific tasking to ECHA from 2027. China RoHS tightens in 2026; some countries require registration\
          \ on specific platforms for RoHS SDoC. Suppliers should provide material declarations (e.g., IPC-1752A) and lab\
          \ verification when needed; “trust but verify” is becoming enforcement norm ([UL Solutions, 2026](https://www.ul.com/news/global-market-access-regulatory-newsletter-q4-2025);\
          \ [UL Solutions—RoHS comparison, 2025](https://www.ul.com/resources/global-market-access-regulatory-news-update);\
          \ [Source Intelligence, 2026](https://blog.sourceintelligence.com/eu-rohs-compliance); [Certivo, 2026](https://www.certivo.com/blog-details/rohs-and-reach-compliance-lessons-from-2025-and-action-steps-for-2026)).\n\
          \n- Device submission pathways and implications for module suppliers:\n  - U.S. 510(k): Typically 6–12 months; cost\
          \ estimates vary from $50k–$500k in direct fees/consulting (excl. internal) to $1–$6 million total program cost\
          \ depending on complexity—relevant if LGIT contemplates module or finished-device offerings rather than pure component\
          \ supply ([AJProTech, 2026](https://ajprotech.com/blog/guides-and-templates/medical-devices-compliance-guide-cost-analysis-budget-strategies-and-fda-and-iso-requirements.html);\
          \ [Complizen, 2025](https://www.complizen.ai/post/eu-mdr-vs-fda-complete-regulatory-comparison-guide-2025)).\n \
          \ - U.S. PMA (Class III implantables like many neurostimulators): Multi-year and multi-million dollar clinical programs;\
          \ under QMSR, supplier purchasing controls may be examined in more detail, including audit reports, increasing the\
          \ compliance premium on implantable-component suppliers ([FDLI, 2025](https://www.fdli.org/2025/12/the-qmsr-transition-new-fda-guidance-and-their-impacts-on-active-implantable-medical-devices/)).\n\
          \  - EU MDR CE-mark for Class IIb/III: 12–18 months and $0.5–$2.0 million typical for device makers; Notified Body\
          \ capacity constraints persist. Module suppliers should align test evidence and material compliance to accelerate\
          \ OEM submissions ([Complizen, 2025](https://www.complizen.ai/post/eu-mdr-vs-fda-complete-regulatory-comparison-guide-2025)).\n\
          \nB5. Time and cost to satisfy access requirements (component supplier perspective)\n\n- ISO 13485–aligned QMS and\
          \ supplier audit readiness: With QMSR effective in 2026, ISO 13485 certification is not legally required in the\
          \ U.S., but is often demanded by OEMs (especially for Tier 1 implantable suppliers). Degrandson notes manufacturers\
          \ will “be asking their suppliers to get ISO Certification” although it is not a regulatory requirement; lead times\
          \ for certification commonly span 6–12 months including gap closure and stage audits (industry norm; timing inferred).\
          \ Suppliers should prepare for recurring audits: Tier 1 typically every 1–2 years; Tier 2 every ~3 years (per Greenlight\
          \ Guru) ([Degrandson, 2025](https://info.degrandson.com/blog/iso-13485-requirements-medical-device-suppliers); [Greenlight\
          \ Guru, 2025](https://www.greenlight.guru/blog/approved-supplier-list)).\n\n- Materials compliance programs: EU\
          \ RoHS delegated directive changes take effect mid-2026; China RoHS tightens Jan 2026; documentation readiness (SDoCs,\
          \ declarations, test reports) should be established by mid-2026 to avoid shipment delays. The cost is programmatic\
          \ (lab testing for high-risk materials/components, supplier declarations) and scales with SKU complexity; considerable\
          \ delays can arise if relying solely on supplier declarations without lab verification ([Source Intelligence, 2026](https://blog.sourceintelligence.com/eu-rohs-compliance);\
          \ [Nemko, 2025](https://www.nemko.com/blog/some-recent-and-upcoming-regulatory-changes-in-china); [Certivo, 2026](https://www.certivo.com/blog-details/rohs-and-reach-compliance-lessons-from-2025-and-action-steps-for-2026)).\n\
          \n- Device-level approvals (if LGIT moves up-stack):\n  - 510(k): 6–12 months typical; total cost $0.05–$6 million\
          \ (wide range; product complexity dependent) ([AJProTech, 2026](https://ajprotech.com/blog/guides-and-templates/medical-devices-compliance-guide-cost-analysis-budget-strategies-and-fda-and-iso-requirements.html);\
          \ [Complizen, 2025](https://www.complizen.ai/post/eu-mdr-vs-fda-complete-regulatory-comparison-guide-2025)).\n \
          \ - EU MDR Notified Body CE-mark: 12–18 months; $0.5–$2 million typical (device complexity dependent) ([Complizen,\
          \ 2025](https://www.complizen.ai/post/eu-mdr-vs-fda-complete-regulatory-comparison-guide-2025)).\n\nB6. Reachable\
          \ ICP counts by subsegment (public, conservative)\n\n- CGM OEMs (major global incumbents): Dexcom, Abbott (FreeStyle\
          \ Libre/OTC Lingo), Medtronic, Senseonics (implantable), Roche (historical), plus smaller/emerging players. The\
          \ market is concentrated in a handful of OEMs; North America leads revenues ([Mordor Intelligence, 2026](https://www.mordorintelligence.com/industry-reports/continuous-glucose-monitoring-market);\
          \ [DataM Intelligence, 2026](https://www.datamintelligence.com/research-report/wearable-continuous-glucose-monitors-market)).\n\
          \n- Implantable neurostimulation OEMs (DIResearch list): Medtronic, Boston Scientific, St. Jude Medical/Abbott,\
          \ LivaNova, Nevro, NeuroPace, Beijing Pins, Synapse Biomedical—8+ major manufacturers globally with North America\
          \ share ~41.7% in 2024 (Astute) ([DIResearch, 2026](https://www.marketresearch.com/Deep-Insights-Research-Co-DIR-v4285/Global-Implantable-Neurostimulation-Devices-Competitive-43881006);\
          \ [Astute Analytica, 2026](https://finance.yahoo.com/news/neurostimulation-devices-market-reach-us-112800847.html)).\n\
          \n- Wearable neurostimulation vendors: Segmented across pain, stroke rehab, and consumer neuromodulation; leading\
          \ players include Medtronic, Abbott, Boston Scientific, LivaNova, Nevro, NeuroMetrix, Helius, electroCore, and others\
          \ (10+ identifiable enterprises) ([Acumen, 2026](https://www.acumenresearchandconsulting.com/wearable-neurostimulation-devices-market)).\n\
          \n- BCI/neural interface companies (emerging): Neuralink, Synchron, Blackrock Neurotech and others (seed through\
          \ growth-stage). These are small in count but high-precision buyers for flexible electrodes and arrays; often prototype-intensive\
          \ and reliant on research collaborations (e.g., parylene-based flexible implants) ([Microsystems & Nanoengineering,\
          \ 2024](https://www.nature.com/articles/s41378-024-00685-6)).\n\n- Medical device CDMOs (multi-vertical; partial\
          \ list): Flex, Jabil, Phillips-Medisize (Molex), Integer, Viant, Sanmina, Celestica, West Pharma (combination devices),\
          \ Tecomet (metal), Tessy, Nordson, Benchmark (10–15 prominent players frequently named) ([CSG Talent, 2026](https://www.csgtalent.com/insights/blog/medical-devices-cdmo-market-2026/);\
          \ [LinkedIn CDMO Market Leaders, 2026](https://www.linkedin.com/pulse/medical-device-cdmo-market-size-2026-ai-technology-outlook-ydugc/)).\n\
          \n- System integrators, Big Tech in health sensing (selectively relevant): Apple and Google continue to invest in\
          \ health sensing; however, CGM integration is mostly through OEM APIs and partnerships rather than direct component\
          \ procurement.\n\nGiven concentration, the reachable ICP universe for initial focus (NA/EU) is manageable: 5–8 CGM\
          \ OEMs, 8–12 implantable neurostim OEMs, 8–12 wearable neurostim vendors, and 10–15 CDMOs cover the vast majority\
          \ of component demand in scope (counts are compiled from cited lists; exact, comprehensive counts are not published\
          \ in a single authoritative registry).\n\nC. Adoption and Obtainability\n\nC7. Analogous adoption-ramp benchmarks\n\
          \n- CGM: The category has grown rapidly with miniaturization, reimbursement, and consumerization (e.g., OTC sensors).\
          \ Mordor Intelligence estimates the CGM market grows from $15.33B in 2026 to $31.38B by 2031 (CAGR ~15.4%), with\
          \ North America leading revenue and Asia Pacific the fastest uptake—indicating strong end-market pull for sensor/electrode\
          \ components in the 2026–2031 window ([Mordor Intelligence, 2026](https://www.mordorintelligence.com/industry-reports/continuous-glucose-monitoring-market)).\
          \ DataM Intelligence notes OTC launches like Dexcom Stelo (2024) increasing sensor segment growth—signals for higher\
          \ attach rates for flexible electrodes/FPC components as volumes broaden beyond insulin-intensive users ([DataM\
          \ Intelligence, 2026](https://www.datamintelligence.com/research-report/wearable-continuous-glucose-monitors-market)).\n\
          \n- Neurostimulation: DIResearch projects the implantable neurostimulation devices market at $7.51B in 2026, growing\
          \ to $14.14B by 2033 (CAGR 9.47%), with North America as a dominant region (Astute puts 41.7% share). FDA approvals\
          \ (e.g., Abbott Eterna SCS in 2022) illustrate a steady pipeline of indications and device refreshes, suggesting\
          \ ongoing demand for advanced leads and electrode arrays ([DIResearch, 2026](https://www.marketresearch.com/Deep-Insights-Research-Co-DIR-v4285/Global-Implantable-Neurostimulation-Devices-Competitive-43881006);\
          \ [OpenPR, 2023](https://www.openpr.com/news/4222026/steady-expansion-forecast-for-implantable-neurostimulation);\
          \ [Astute Analytica, 2026](https://finance.yahoo.com/news/neurostimulation-devices-market-reach-us-112800847.html)).\n\
          \n- Wearable neurostimulation: Market revenue projected to 2032 at ~$1.84B with a 13.3% CAGR from 2024; North America\
          \ ~ $334.5M in 2023. This indicates sustained adoption for non-implant neuromodulation with growing use cases (e.g.,\
          \ stroke rehab), supporting flexible electrode demand in patches and headbands ([Acumen, 2026](https://www.acumenresearchandconsulting.com/wearable-neurostimulation-devices-market)).\n\
          \n- BCI/flexible implantable electrodes: The flexible implantable electrode market is forecast at ~$2.9B in 2026\
          \ to $4.45B by 2030 (CAGR ~11.3%), reflecting broader adoption of flexible interfaces in multiple indications. This\
          \ suggests that fine-pattern electrode manufacturing aligns with a growth vector adjacent to, and partially overlapping\
          \ with, implantable neurostimulation ([Research and Markets, 2026](https://www.researchandmarkets.com/reports/6226271/flexible-implantable-electrode-market-report?srsltid=AfmBOor8dsx_llOQDaZ7BkgAiK3Qzdjc37nW7mg6sN1USg87qlzXCOfO)).\n\
          \nC8. Typical switching timelines (components/vendors)\n\n- Change-control friction is high. Matric (electronics\
          \ CM for med devices) emphasizes that if a PCB component approved in a 510(k) is changed, clearance is often required;\
          \ even a $1 part can stall a $10,000 device for months. That implies vendor switches for critical electrodes/substrates—even\
          \ at the component level—require extensive revalidation and may trigger regulatory submissions (e.g., design change\
          \ notification, 510(k) supplement), making replacement timelines often 6–18 months end-to-end depending on class\
          \ and risk ([Matric, 2026](https://www.matric.com/medical-device-supply-chain)).\n\n- Supplier auditing cadence:\
          \ Tier-1 suppliers are often audited prior to onboarding and every 1–2 years thereafter; Tier-2 every ~3 years;\
          \ Tier-3 audits occur on cause. This cadence, plus device-level requalification, defines a realistic 9–18 month\
          \ window to shift spend to a new supplier for critical electrodes/leads/substrates ([Greenlight Guru, 2025](https://www.greenlight.guru/blog/approved-supplier-list)).\n\
          \nC9. Public penetration and attach-rate benchmarks\n\n- Direct attach-rate data for flexible medical electrodes/substrates\
          \ are not published. Proxy indicators include:\n  - North America’s 53.4% share of the wearable CGM devices market\
          \ in 2024 suggests high sensor penetration relative to other regions—implying heavier regional demand for patch\
          \ electrodes and flexible interconnects ([DataM Intelligence, 2026](https://www.datamintelligence.com/research-report/wearable-continuous-glucose-monitors-market)).\n\
          \  - Neurostimulation market regional share (North America 41.7% in 2024) indicates an attach base for implantable\
          \ lead/electrode components where suppliers like Integer and OEMs (Medtronic, Abbott) operate robust pipelines ([Astute\
          \ Analytica, 2026](https://finance.yahoo.com/news/neurostimulation-devices-market-reach-us-112800847.html)).\n \
          \ These are market-share proxies rather than component attach rates; direct attach rates remain unspecified in public\
          \ sources.\n\nC10. Evidence-backed versus speculative markers\n\n- Evidence-backed:\n  - Market sizes and growth\
          \ for CGM (2026 $15.33B; CAGR to 2031) ([Mordor Intelligence, 2026](https://www.mordorintelligence.com/industry-reports/continuous-glucose-monitoring-market)).\n\
          \  - Implantable neurostimulation (2026 $7.51B; CAGR to 2033) ([DIResearch, 2026](https://www.marketresearch.com/Deep-Insights-Research-Co-DIR-v4285/Global-Implantable-Neurostimulation-Devices-Competitive-43881006)).\n\
          \  - Wearable neurostimulation CAGR and 2023 NA baseline ([Acumen, 2026](https://www.acumenresearchandconsulting.com/wearable-neurostimulation-devices-market)).\n\
          \  - Regulatory gates and supplier audit expectations (QMSR; audit clause; ASL processes) ([FDA, 2024](https://www.federalregister.gov/documents/2024/02/02/2024-01709/medical-devices-quality-system-regulation-amendments);\
          \ [Greenlight Guru, 2025](https://www.greenlight.guru/blog/approved-supplier-list)).\n\n- Speculative/inferred (clearly\
          \ labeled in this report):\n  - Component BOM share ranges applied to device markets to estimate component-revenue\
          \ SAM (we used conservative 8–12% for implantable neurostimulation and 12–18% for CGM electrodes/substrates; see\
          \ Section D).\n  - Regional splits for Europe when not explicitly provided (our ranges are shown, with North America\
          \ shares anchored in published data; EU shares are estimated and flagged).\n  - BCI “wedge” sizing within the flexible\
          \ implantable electrode market (we conservatively assume 10% non-overlapping contribution and haircut to avoid double\
          \ counting).\n\nD. SAM, SOM, and Market Reachability\n\nD1. Market foundations (2026; evidence)\n\n- CGM market\
          \ (global 2026): $15.33B; strong 2026–2031 CAGR 15.42%; North America leads revenue, Asia Pacific fastest growth\
          \ ([Mordor Intelligence, 2026](https://www.mordorintelligence.com/industry-reports/continuous-glucose-monitoring-market)).\n\
          \n- North America CGM share (proxy 2024): 53.4% of wearable CGM devices revenue; we use this as a directional anchor\
          \ for 2026 share in NA ([DataM Intelligence, 2026](https://www.datamintelligence.com/research-report/wearable-continuous-glucose-monitors-market)).\n\
          \n- Implantable neurostimulation device market (global 2026): $7.507B; growing to $14.143B by 2033 (CAGR 9.47%)\
          \ ([DIResearch, 2026](https://www.marketresearch.com/Deep-Insights-Research-Co-DIR-v4285/Global-Implantable-Neurostimulation-Devices-Competitive-43881006)).\n\
          \n- North America neurostimulation share (2024): ~41.7% ([Astute Analytica, 2026](https://finance.yahoo.com/news/neurostimulation-devices-market-reach-us-112800847.html)).\n\
          \n- Wearable neurostimulation (global 2023 baseline): $608.2M; CAGR 13.3% to 2032; NA value ~$334.5M in 2023 (we\
          \ back-solve to ~2026) ([Acumen, 2026](https://www.acumenresearchandconsulting.com/wearable-neurostimulation-devices-market)).\n\
          \n- Flexible implantable electrode market (global 2026): ~$2.9B, to $4.45B by 2030 (CAGR 11.3%)—used here as a triangulation\
          \ for electrode components and an emerging BCI wedge (see double-counting controls below) ([Research and Markets,\
          \ 2026](https://www.researchandmarkets.com/reports/6226271/flexible-implantable-electrode-market-report?srsltid=AfmBOor8dsx_llOQDaZ7BkgAiK3Qzdjc37nW7mg6sN1USg87qlzXCOfO)).\n\
          \nD2. Component-revenue SAM estimation (method, assumptions, results)\n\nMethod\n- We estimate SAM as the annual\
          \ component revenue for “flexible substrate and electrode” content that LGIT could plausibly supply in 2026 for\
          \ initial regions (North America + Europe), then globally.\n- For each segment, we apply a conservative component\
          \ BOM-share range to the segment’s device revenue and allocate regional shares using available data; where EU shares\
          \ are not published, we present ranges and clearly label them as analyst inference.\n- We avoid double counting\
          \ by:\n  - Using device-market-based calculations for CGM and implantable/wearable neurostimulation.\n  - Treating\
          \ the “flexible implantable electrode” market as a triangulation point and isolating only a BCI-specific “wedge”\
          \ not already included in implantable neurostimulation (conservatively assumed at ~10% of the flexible electrode\
          \ market, then further haircut for non-overlap).\n\nAssumptions (inferred; ranges used)\n- CGM electrode + flexible\
          \ substrate share of device revenue: 12–18% (reflecting sensor electrode stack + flexible interconnect contribution\
          \ in a disposable patch/module; conservative and justified by the centrality of sensor accuracy and lifetime to\
          \ device value).\n- Implantable neurostimulation leads/electrodes + flexible circuits share: 8–12% (reflecting IPG\
          \ cost dominance but nontrivial cost of leads/electrodes and their criticality).\n- Wearable neurostimulation electrodes/substrates\
          \ share: 10–15% (lower complexity than implants, but still critical to performance).\n- BCI wedge within flexible\
          \ implantable electrode market: 10% of global flexible electrode market; NA+EU share: 70% (emergent and research-heavy\
          \ in the West); we then apply a conservative 50% haircut to avoid overlap with neurostimulation devices.\n\nRegional\
          \ splits (evidence/inference)\n- North America CGM: 53.4% (proxy 2024 share).\n- Europe CGM: 25–30% (inference;\
          \ NA leads, APAC fastest-growing; EU second-largest).\n- North America implantable neurostimulation: 41.7% (evidence).\n\
          - Europe implantable neurostimulation: 30–35% (inference; EU is a major center of neuromodulation).\n- Wearable\
          \ neurostimulation NA+EU: assume 70% of global (inference; NA/EU stronger early adoption).\n\nResults (2026)\n\n\
