          \nA5. Distribution Route Mix and Channel Power\n- Components/modules:\n  - Direct to OEM: Preferred for strategic\
          \ components (flex electrodes, thin‑film arrays, hermetic interconnects) due to co‑development and validation complexity;\
          \ OEMs hold leverage via volume and regulatory gatekeeping (DHF/DMR ownership).\n  - Through CDMOs: Common route\
          \ for new entrants; CDMOs (Flex, Jabil, Integer, Linxens, Cirtec, Resonetics) possess regulatory infrastructure,\
          \ process validation know‑how, and OEM relationships; they hold channel power in qualifying suppliers and integrating\
          \ components into device builds ([Arshon, 2026](https://arshon.com/blog/contract-manufacturing-for-medical-devices-a-strategic-guide-for-medtech-oems);\
          \ [MarketsandMarkets, 2026](https://www.marketsandmarkets.com/Market-Reports/medical-device-contract-manufacturing-market-170622851.html)).\n\
          - Devices to market:\n  - CGM: Payer/DME networks (e.g., Edgepark) and retail OTC (for Stelo) drive large unit volumes;\
          \ ultimately informs upstream component demand but component suppliers have limited influence downstream ([Edgepark,\
